[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshtastic-routing-sim"
version = "0.1.0"
description = "Meshtastic routing simulator: ITM+SRTM, fading, meshtasticd shards"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "geopy>=2.4",
  "itmlogic>=1.2",
  "srtm-py>=0.3",
  "meshtastic>=2.5",
  "docker>=7.0",
  "influxdb-client>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["backend"]
