[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshtastic-routing-sim"
version = "0.1.0"
description = "Meshtastic routing simulator: ITM+NMT GUGiK, fading, meshtasticd shards"
requires-python = ">=3.11"
# Single source of runtime dependencies (also used by backend/Dockerfile).
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# scripts/validation: dekodowanie zrzutu lorastats, statystyki, rysunki do pracy.
validation = ["httpx>=0.27", "cryptography>=42", "scipy>=1.11", "matplotlib>=3.8"]

[tool.setuptools.dynamic]
dependencies = { file = ["backend/requirements.txt"] }

[tool.setuptools.packages.find]
where = ["backend"]
